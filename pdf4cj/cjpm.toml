[dependencies]

[package]
  cjc-version = "1.0.0"
  name = "pdf4cj"
  description = "Pure Cangjie PDF structural parser and extractor (text, shapes, images, tables)"
  version = "0.1.0"
  authors = ["EthanCheung"]
  repository = "https://gitcode.com/Cangjie-TPC/pdf4cj"
  license = ["MIT"]
  tag = ["pdf", "parser", "extractor", "document"]
  output-type = "dynamic"
  src-dir = "src"
  include = ["src", "tests", "doc", "example", "CHANGELOG.md", "LICENSE", "README.OpenSource", "README.md", "cjpm.toml"]
  exclude = ["target", "stdx", "*.log", ".cache"]

[target.x86_64-unknown-linux-gnu.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}/linux_x86_64_llvm/dynamic/stdx"]
[target.aarch64-unknown-linux-gnu.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}/linux_aarch64_llvm/dynamic/stdx"]
[target.x86_64-apple-darwin.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}/darwin_x86_64_llvm/dynamic/stdx"]
[target.aarch64-apple-darwin.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}/darwin_aarch64_llvm/dynamic/stdx"]
[target.x86_64-w64-mingw32.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}/windows_x86_64_llvm/dynamic/stdx"]
